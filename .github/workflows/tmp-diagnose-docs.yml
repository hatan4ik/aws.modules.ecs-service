# Temporary diagnostic: reproduces the quality pipeline's steps for the root
# directory and prints what the docs drift check sees. Removed once resolved.
name: tmp-diagnose-docs

on:
  push:
    branches:
      - feat/v1-composable-service

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false -no-color && terraform validate -no-color
      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0
      - run: tflint --init && tflint
      - run: terraform test -no-color
      - uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: false
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Status before docs
        run: |
          echo "::group::porcelain --ignored"
          git status --porcelain --ignored
          echo "::endgroup::"
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: "false"
          git-push: "false"
      - name: Status after docs
        if: always()
        run: |
          echo "::group::porcelain"
          git status --porcelain
          echo "::endgroup::"
          echo "::group::diff"
          git --no-pager diff
          echo "::endgroup::"
